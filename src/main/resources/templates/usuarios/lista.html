<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Usuarios — Citas Médicas</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
</head>
<body>
<header th:replace="~{fragments/layout :: topbar}"></header>

<div class="page">
    <div class="page-header">
        <div>
            <h1>Usuarios</h1>
            <p>Gestión de usuarios del sistema y asignación de roles.</p>
        </div>
        <a th:href="@{/usuarios/nuevo}" class="btn btn-primary">+ Nuevo usuario</a>
    </div>

    <p class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></p>
    <p class="alert alert-danger" th:if="${error}" th:text="${error}"></p>

    <div class="table-wrap">
        <div class="table-scroll">
            <table th:if="${not #lists.isEmpty(usuarios)}">
                <thead>
                <tr>
                    <th>Usuario</th>
                    <th>Nombre completo</th>
                    <th>Rol</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="u : ${usuarios}">
                    <td class="codigo" th:text="${u.username}"></td>
                    <td th:text="${u.nombreCompleto}"></td>
                    <td>
                        <span class="badge badge-ROL" th:text="${u.rol.nombre}"></span>
                        <span class="hint" th:unless="${u.rol.activo}">(rol inactivo)</span>
                    </td>
                    <td>
                        <span class="badge" th:classappend="${u.activo} ? 'badge-ACTIVO' : 'badge-INACTIVO'"
                              th:text="${u.activo} ? 'ACTIVO' : 'INACTIVO'"></span>
                    </td>
                    <td class="acciones">
                        <a th:href="@{'/usuarios/' + ${u.id} + '/editar'}" class="btn btn-ghost btn-sm">Editar</a>
                        <form th:action="@{'/usuarios/' + ${u.id} + '/estado'}" method="post" class="inline-form">
                            <button type="submit" class="btn btn-ghost btn-sm"
                                    th:text="${u.activo} ? 'Desactivar' : 'Activar'">Desactivar</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="empty-state" th:if="${#lists.isEmpty(usuarios)}">No hay usuarios registrados.</div>
    </div>
</div>
</body>
</html>
