<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Iniciar sesión — Citas Médicas</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
</head>
<body>
<div class="login-wrap">
    <div class="brand">
        <div class="topbar-icon">+</div>
        <div>
            <div class="brand-mark">Citas Médicas</div>
            <div class="brand-sub">Sistema de Gestión Hospitalaria</div>
        </div>
    </div>

    <div class="card">
        <h2 style="margin-bottom:14px;">Iniciar sesión</h2>

        <p class="alert alert-danger" th:if="${param.error}">Usuario o contraseña incorrectos, o usuario inactivo.</p>
        <p class="alert alert-success" th:if="${param.logout}">Cerraste sesión correctamente.</p>

        <form th:action="@{/login}" method="post" class="form-grid">
            <div class="field field-full">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" required autofocus autocomplete="username"/>
            </div>
            <div class="field field-full">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required autocomplete="current-password"/>
            </div>
            <div class="form-actions field-full">
                <button type="submit" class="btn btn-primary">Ingresar</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
