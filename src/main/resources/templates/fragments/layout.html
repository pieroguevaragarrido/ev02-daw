<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Barra superior compartida. Solo muestra las opciones permitidas para el rol actual.
     (La seguridad real se valida en el backend con SecurityConfig; esto es solo presentación.) -->
<header th:fragment="topbar" class="topbar">
    <div class="brand">
        <div class="topbar-icon">+</div>
        <div>
            <div class="brand-mark">Citas Médicas</div>
            <div class="brand-sub">Sistema de Gestión Hospitalaria</div>
        </div>
    </div>

    <nav class="nav">
        <a th:if="${rolActual == 'ADMINISTRADOR' or rolActual == 'RECEPCIONISTA'}" th:href="@{/citas}">Citas</a>
        <a th:if="${rolActual == 'ADMINISTRADOR' or rolActual == 'MEDICO' or rolActual == 'RECEPCIONISTA'}" th:href="@{/pacientes}">Pacientes</a>
        <a th:if="${rolActual == 'ADMINISTRADOR' or rolActual == 'RECEPCIONISTA'}" th:href="@{/medicos}">Médicos</a>
        <a th:if="${rolActual == 'ADMINISTRADOR'}" th:href="@{/usuarios}">Usuarios</a>
        <a th:if="${rolActual == 'ADMINISTRADOR'}" th:href="@{/roles}">Roles</a>
        <a th:if="${rolActual == 'ADMINISTRADOR'}" th:href="@{/auditoria}">Auditoría</a>
    </nav>

    <div class="user-box">
        <span><strong th:text="${usuarioActual}">usuario</strong> · <span th:text="${rolActual}">ROL</span></span>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-ghost btn-sm">Cerrar sesión</button>
        </form>
    </div>
</header>

</body>
</html>
